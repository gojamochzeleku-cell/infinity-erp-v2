<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { 'erp-black': '#0a0a0a', 'erp-dark': '#141414', 'erp-card': '#1a1a1a', 'erp-border': '#2a2a2a', 'erp-gold': '#D4AF37' } } } }
    </script>
</head>
<body class="bg-erp-black text-gray-200 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-erp-card border border-erp-border rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-erp-gold">Password Reset Request</h1>
            <p class="text-gray-400 text-sm mt-2">Enter your username. The Admin will review and approve your request.</p>
        </div>
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-500/10 border border-green-500/30 text-green-400 px-4 py-3 rounded-lg mb-4 text-sm">{{ success }}</div>
        {% endif %}
        <form action="/api/request-reset" method="POST" class="space-y-4">
            <input type="text" name="username" required placeholder="Your Username" class="w-full bg-erp-dark border border-erp-border rounded-lg px-4 py-3 text-white focus:border-erp-gold focus:outline-none">
            <button type="submit" class="w-full bg-erp-gold hover:bg-erp-gold-dark text-black font-bold py-3 rounded-lg transition-colors">Submit Request to Admin</button>
        </form>
        <a href="/login" class="block text-center text-gray-400 hover:text-white text-sm mt-4"><i class="fas fa-arrow-left mr-1"></i> Back to Login</a>
    </div>
</body>
</html>
